<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: https://fonts.gstatic.com https://zhaoolee.com; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src 'self' file:; connect-src 'self';" />
    <link rel="stylesheet" href="bubble.css" />
    <link rel="stylesheet" href="bubble-overrides.css" />
    <link rel="stylesheet" href="bubble-themes.css" />
    <link rel="stylesheet" href="stickers.css" />

  <body>
    <section class="bubble-shell">
      <div class="bubble-head"><div class="brand-mark"><img id="bubbleAvatarImage" src="/avatars/zhixu.png" alt="" /></div><div class="bubble-heading"><strong id="bubbleAssistantName">知序</strong><span id="bubbleTitle">该干活了</span></div><span id="bubbleStackInfo" class="stack-info" aria-live="polite"></span><button id="closeButton" class="close" type="button" aria-label="关闭当前提醒" title="关闭当前提醒">×</button></div>

      <div id="quickActions" class="quick-actions"></div>
      <form id="bubbleForm"><input id="bubbleInput" autocomplete="off" placeholder="回复知序……" /><button type="submit">发送</button></form>
      <button id="openMainButton" class="open-main">打开完整调度窗</button>
    </section>
    <audio id="alertSound" preload="auto"></audio>
    <script src="stickers.js"></script>
    <script src="online-sticker.js"></script>
    <script src="sticker-ui.js"></script>
    <script src="chat-profile.js"></script>
